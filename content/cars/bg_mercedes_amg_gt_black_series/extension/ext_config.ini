[RENDERING_CAMERA_0]
DYNAMIC_TEXTURE_ID = camera_rear ; here, we will create “dynamic::camera_rear” texture
POSITION = 0, 0.62, -2.34
DIRECTION = 0, -0.5, -1
INCLUDE_CAR = 1
REFRESH_RATE = 20  ; doesn’t need to update too often, those in-car cameras are usually pretty nasty
INTERIOR_ONLY = 1  ; stop rendering if camera is not interior one
CLIP_NEAR = 0.005  ; the way it’s positioned, it needs to render things that are very close (bits of car)
FOV = 170          ; huge FOV to get that authentic look
RESOLUTION = 2048, 1236 ; and massive resolution too
ACTIVE_BY_DEFAULT = 0 ; inactive by default, activated by a script
WITH_LIGHTING = 1
DYNAMIC_OPACITY = 0  ; disabling component from the start, relying on scriptable display to activate it when needed
;RELATIVE_TO = GEAR_R

; Can’t really render camera like that with that huge FOV, gotta add a bit of preprocessing, namely — 
; fisheye filter to get it look curved and zoomed in in the middle.
[TEXTURE_PREPROCESSING_...]
DYNAMIC_TEXTURE_ID = camera_rear_distorted ; new “dynamic::camera_rear_distorted” texture
TEXTURE_SOURCE = dynamic::camera_rear ; use previously specificed camera texture
RESOLUTION = 1024, 668 ; target resolution matches screen one, RESOLUTION for camera is just that multiplied by four
EFFECT = FISHEYE  ; use BASIC if you only need color correction (SATURATION, BRIGHTNESS, etc.)
INTENSITY = 1.5   ; intensity of fisheye effect, adjusted for 170° FOV
EXPOSURE = 0.56      ; this value activates tonemapping to get image from HDR to LDR space
BRIGHTNESS = 0.7  ; a bit dimmer
DYNAMIC_OPACITY = 0  ; disabling component from the start, relying on scriptable display to activate it when needed


[SCRIPTABLE_DISPLAY_...]
; Example of scriptable display
MESHES = lcd
KEEP_BACKGROUND = 1 ; Stop CSP from painting original texture as background to get stereo and navigator 
  ; to work. Script will need to reset background manually or things will leave trails.
INTERACTIVE = 1 ; Keep track of mouse position over the display (adds extra cost, especially on high poly meshes)
FORCE_UPDATE_AFTER = NAVIGATOR_0
SCRIPT = '

local colorCover = rgbm(0, 0, 0, 1)
local colorWhite = rgbm(1, 1, 1, 1)

local buttons = {
  { points = { vec2(740, 606), vec2(849, 606), vec2(849, 668), vec2(740, 668) }, title = "Created by B. Gili (MNBA)" },
  { points = { vec2(195, 0), vec2(343, 0), vec2(343, 60), vec2(195, 60) }, screen = "CAR_STEREO_0" },
  { points = { vec2(509, 0), vec2(670, 0), vec2(670, 60), vec2(509, 60) }, title = "Phone is not connected" },
  { points = { vec2(90, 0), vec2(195, 0), vec2(195, 60), vec2(90, 60) }, screen = "NAVIGATOR_0" },
  { points = { vec2(855, 0), vec2(943, 0), vec2(943, 60), vec2(855, 60) }, title = "no apps installed" },
  { points = { vec2(0, 606), vec2(275, 606), vec2(275, 668), vec2(0, 668) } },
  { points = { vec2(343, 0), vec2(509, 0), vec2(509, 60), vec2(343, 60) }, screen = "CAR_STEREO_1" },
}

local startingMode = tonumber(ac.loadDisplayValue("startingMode", 4)) or 1
local previousSection = startingMode
local currentSection = startingMode
local activationProgress = 0
local gearsGrowth = {}

function update(dt)
  -- Updating state
  if currentSection ~= previousSection then
    activationProgress = math.max(0, activationProgress - dt * 3)
    if activationProgress == 0 then
      ac.setDynamicTextureShift(buttons[previousSection].screen, 0)
      previousSection = currentSection
    end
  elseif activationProgress < 1 then
    activationProgress = math.min(1, activationProgress + dt * 3)
  end
  ac.setDynamicTextureShift(buttons[previousSection].screen, activationProgress)

  -- A bit of a placeholders (temporary?) for missing sections
  if buttons[previousSection].screen == nil then
    -- Restoring original background
    display.image{ image = "car::lcd2.dds", pos = vec2(), size = vec2(1024, 668) }

    if previousSection == 6 then
      settings()
    elseif buttons[previousSection].title ~= nil then
      ui.pushStyleVar(ui.StyleVar.Alpha, activationProgress)
      display.rect{ pos = vec2(), size = vec2(1024, 668), color = rgbm(0, 0, 0, 0.9) }
      display.text{ 
        text = buttons[previousSection].title, 
        pos = vec2(320, 300), 
        letter = vec2(20, 50),
        font = "sls",
        width = 400,
        alignment = 0.5
      }
      ui.popStyleVar()
    end
  end

  -- Buttons, also useful to recreate the curved mask
  local hoveredButton = 0
  ui.beginTextureSaturationAdjustment()         -- adjusting texture to hide original selection
  ui.setShadingOffset(1, 0)                  -- this one is for color×2-0.5, along with desaturation hides selection
  ui.beginTextureShade("car::lcd2.dds")  -- all shapes drawn here will get a texture mapped on top of them
  for i = 1, #buttons do
    local btn = buttons[i].points
    if ui.rectHovered(btn[1], btn[3]) then
      hoveredButton = i
      if ui.mouseClicked() then currentSection = i end
    end
    ui.drawQuadFilled(btn[1], btn[2], btn[3], btn[4], colorWhite)
  end
  ui.endTextureSaturationAdjustment(0)
  ui.endTextureShade(vec2(), vec2(1024, 668))
  ui.setShadingOffset()

  -- Highlight for selected button
  if currentSection ~= 0 then
    local btn = buttons[currentSection].points
    ui.beginGradientShade()
    ui.drawQuadFilled(btn[2] - vec2(20, 0), btn[2], btn[3], btn[3] - vec2(20, 0), rgbm(0.9, 0.5, 0, 0.5))
    ui.endGradientShade(btn[2] - vec2(20, 0), btn[3], rgbm(0.9, 0.5, 0, 1), rgbm(0.9, 0.5, 0, 1))
  end

  -- Highlight for hovered button
  if hoveredButton ~= 0 and hoveredButton ~= currentSection then
    local btn = buttons[hoveredButton].points
    ui.beginGradientShade()
    ui.drawQuadFilled(btn[2] - vec2(20, 0), btn[2], btn[3], btn[3] - vec2(20, 0), rgbm(1, 1, 1, 0.5))
    ui.endGradientShade(btn[2] - vec2(20, 0), btn[3], rgbm(0.9, 0.5, 0, 1), rgbm(0.9, 0.5, 00, 1))
  end

  -- Reception indicator to reduce in tunnels or with bad weather
  local satelliteOcclusion = ac.estimateSatelliteOcclusion()
  if satelliteOcclusion < 0.25 then
    display.rect{ pos = vec2(340.8, 382.4), size = vec2(16.8, 19.8), color = colorCover }
  elseif satelliteOcclusion < 0.5 then
    display.rect{ pos = vec2(346.1, 382.1), size = vec2(11.7, 19.4), color = colorCover }
  elseif satelliteOcclusion < 0.75 then
    display.rect{ pos = vec2(351.5, 382.4), size = vec2(5.7, 19.1), color = colorCover }
  end

  if car.gear ~= -1 then  
    -- If gear is not reverse, activate navigator:
    ac.setRenderingCameraActive("RENDERING_CAMERA_0", true)  -- pause rendering camera
    return  -- and we’re done here, so let’s stop
  end

  -- Gear is reverse!
  ac.setDynamicTextureShift("NAVIGATOR_0", 0)  -- let’s stop navigator
  ac.setDynamicTextureShift("CAR_STEREO_0", 0)  -- let’s stop navigator
  ac.setDynamicTextureShift("CAR_STEREO_1", 0)  -- let’s stop navigator
  ac.setRenderingCameraActive("RENDERING_CAMERA_0", 0)  -- activate rendering camera
  display.image{pos = vec2(24, 71), size = vec2(974, 529), image = "dynamic::camera_rear_distorted"}  -- and draw fisheye camera

  -- And we’re done! But for a bit of extra authenticity let’s add lines with trajectory:
  local startL = vec2(225, 550)  -- one thing to note: I haven’t really properly calibrated those lines yet
  local startR = vec2(800, 550)
  local direction = vec2(15, -25):normalize()
  local lineLen = 220
  local steps = 9
  local steerOffset = -car.steer * 0.15
  local currentPosL = startL
  local currentPosR = startR
  local color = rgbm(1, 0, 0, 1)
  for i = 1, steps do
    local newPosL = startL + direction * (i * (lineLen / steps)) + vec2(steerOffset * (i / steps) ^ 2, 0)
    local newPosR = startR + vec2(-direction.x, direction.y) * (i * (lineLen / steps)) + vec2(steerOffset * (i / steps) ^ 2, 0)
    local drawAcrossColor = color
    if i == 4 then
      color = rgbm(1, 1, 0, 1)
    elseif i == 7 then
      color = rgbm(0, 1, 0, 1)
    else
      drawAcrossColor = i == 9 and color or nil
    end
    ui.drawLine(currentPosL, newPosL, color, 4)
    ui.drawLine(currentPosR, newPosR, color, 4)
    if drawAcrossColor ~= nil then
      ui.drawLine(currentPosL, currentPosR, drawAcrossColor, 4)
    end
    currentPosL = newPosL
    currentPosR = newPosR
    direction:add(vec2(0, 0.02)):normalize()
  end

  -- And a warning:
  display.rect{pos = vec2(320, 76), size = vec2(396, 32), color = rgbm(0, 0, 0, 0.8 )}
  display.text{pos = vec2(320, 86), letter = vec2(12, 20), text = "Check surroundings for safety", font = "aria", width = 396, alignment = 0.5 }
end

function settings()
  local whiteColor = rgbm(1, 1, 1, 1)
  local accentColor = rgbm(1, 0.1, 0.1, 1)

  function radioButton(text, pos, mode)
    display.text{ text = text, pos = pos, letter = vec2(11, 22), font = "sls" }

    local circlePos = pos + vec2(-20, 10)
    ui.drawCircleFilled(circlePos, 10, whiteColor, 20)

    local hovered = ui.rectHovered(circlePos - 10, circlePos + vec2(110, 10))
    if startingMode == mode then
      ui.drawCircleFilled(circlePos, 8, accentColor)
    elseif hovered then
      ui.drawCircleFilled(circlePos, 8, rgbm(0.4, 0.4, 0.4, 1))
      if ui.mouseClicked() then
        startingMode = mode
        ac.saveDisplayValue("startingMode", mode)
      end
    end
  end 

  ui.pushStyleVar(ui.StyleVar.Alpha, activationProgress)
  display.rect{ pos = vec2(), size = vec2(1024, 668), color = rgbm(0, 0, 0, 0.9) }
  display.text{ text = "Starting mode:", pos = vec2(350, 120), letter = vec2(20, 50), font = "sls" }
  radioButton("Navigator", vec2(500, 200), 4)
  radioButton("Radio", vec2(500, 250), 2)
  radioButton("Media", vec2(500, 300), 7)
  radioButton("Phone", vec2(500, 350), 3)
  radioButton("App", vec2(500, 400), 5)
  radioButton("Info", vec2(500, 450), 1)
  ui.popStyleVar()
end'


