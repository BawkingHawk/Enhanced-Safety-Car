===== ALWAYS-ON SAFETY CAR LIGHTS (ApexCoach modification) =====
; Appended at the END of the file on purpose: when several emissive
; sections target the same mesh, the later one wins. These constant
; sections therefore override the Extra A/B switch states above, keeping
; the full amber SC package lit permanently - needed because extra
; switches cannot be toggled on an AI-driven car. Headlight/brake strobes
; above are intentionally left switch-bound.

[EMISSIVE_LIGHT_...]
NAME=carbon_8_SUB1
COLOR=200,100,0,0.5
OFF_COLOR=200,100,0,0.5
CAST_LIGHT=1

[EMISSIVE_LIGHT_...]
NAME=carbon_8_SUB0
COLOR=200,75,0,0.03
OFF_COLOR=200,75,0,0.03

[EMISSIVE_LIGHT_...]
NAME=carbon_9_SUB1,Light_B
COLOR=200,100,0,0.5
OFF_COLOR=200,100,0,0.5
CAST_LIGHT=1

[EMISSIVE_LIGHT_...]
NAME=carbon_9_SUB0
COLOR=200,75,0,0.03
OFF_COLOR=200,75,0,0.03

[EMISSIVE_LIGHT_...]
NAME=Light_T
COLOR=200,100,0,0.5
OFF_COLOR=200,100,0,0.5

[EMISSIVE_LIGHT_...]
NAME=Light_R
COLOR=200,100,0,0.1
OFF_COLOR=200,100,0,0.1

[EMISSIVE_LIGHT_...]
